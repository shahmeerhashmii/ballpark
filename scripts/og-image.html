<!doctype html>
<!--
  Source for public/og-image.png, the 1200x630 picture shown when someone shares the Ballpark link
  (iMessage, WhatsApp, X, LinkedIn, Facebook). To change it, edit this file and re-render it at
  1200x630, for example with: npx playwright screenshot --viewport-size=1200,630 scripts/og-image.html public/og-image.png
-->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Bricolage Grotesque'; font-weight: 800; src: url('../node_modules/@fontsource/bricolage-grotesque/files/bricolage-grotesque-latin-800-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Instrument Sans'; font-weight: 500; src: url('../node_modules/@fontsource/instrument-sans/files/instrument-sans-latin-500-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Instrument Sans'; font-weight: 700; src: url('../node_modules/@fontsource/instrument-sans/files/instrument-sans-latin-700-normal.woff2') format('woff2'); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 28% 110%, #12301c 0%, #0B0B0B 62%);
    color: #F5F5F0;
    font-family: 'Instrument Sans', sans-serif;
    display: grid;
    grid-template-columns: 560px 1fr;
    align-items: center;
  }
  .field { width: 560px; height: 630px; }
  .copy { padding-right: 70px; }
  .eyebrow { font-weight: 700; font-size: 22px; letter-spacing: 3px; text-transform: uppercase; color: #C6F432; margin: 0 0 14px; }
  h1 { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 118px; line-height: 0.95; margin: 0; letter-spacing: -2px; }
  p { font-size: 36px; line-height: 1.25; color: #C9C9C0; margin: 22px 0 34px; max-width: 470px; text-wrap: balance; }
  .balls { display: flex; gap: 14px; }
  .balls span { width: 34px; height: 34px; border-radius: 50%; }
</style>
</head>
<body>
  <svg class="field" viewBox="0 0 560 630">
    <!-- stands -->
    <path d="M 280 600 L 21 341 A 366 366 0 0 1 539 341 Z" fill="#161616" />
    <!-- outfield grass -->
    <path d="M 280 600 L 56 376 A 317 317 0 0 1 504 376 Z" fill="#173D24" />
    <path d="M 120 440 A 226 226 0 0 1 440 440" stroke="rgba(255,255,255,0.05)" stroke-width="28" fill="none" />
    <path d="M 168 488 A 158 158 0 0 1 392 488" stroke="rgba(255,255,255,0.05)" stroke-width="28" fill="none" />
    <!-- infield -->
    <path d="M 280 600 L 196 516 L 280 432 L 364 516 Z" fill="#4A3426" />
    <path d="M 280 572 L 223 516 L 280 460 L 337 516 Z" fill="#1F4D2E" />
    <!-- wall -->
    <path d="M 56 376 A 317 317 0 0 1 504 376" stroke="#C6F432" stroke-width="12" fill="none" stroke-linecap="round" />
    <text x="280" y="312" fill="#C6F432" font-family="Bricolage Grotesque" font-weight="800" font-size="22" text-anchor="middle">400</text>
    <!-- flight path and ball over the wall -->
    <path d="M 280 590 Q 330 210 452 132" stroke="#F5F5F0" stroke-width="6" stroke-dasharray="2 16" stroke-linecap="round" fill="none" />
    <circle cx="458" cy="128" r="30" fill="#F5F5F0" />
    <path d="M 441 106 Q 451 128 441 150 M 475 106 Q 465 128 475 150" stroke="#E0503F" stroke-width="4" fill="none" stroke-linecap="round" />
    <!-- foul lines and plate -->
    <line x1="280" y1="600" x2="56" y2="376" stroke="#EDEDE4" stroke-width="3" />
    <line x1="280" y1="600" x2="504" y2="376" stroke="#EDEDE4" stroke-width="3" />
    <path d="M 272 588 h 16 v 8 l -8 8 l -8 -8 Z" fill="#EDEDE4" />
  </svg>
  <div class="copy">
    <div class="eyebrow">Daily estimation game</div>
    <h1>Ballpark</h1>
    <p>Guess the number. Hit it out of the park.</p>
    <div class="balls">
      <span style="background:#C6F432"></span>
      <span style="background:#F2C14E"></span>
      <span style="background:#C6F432"></span>
      <span style="background:#D9D9CF"></span>
      <span style="background:#FF9F43"></span>
    </div>
  </div>
</body>
</html>
